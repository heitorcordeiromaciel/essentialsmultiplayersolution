# Hostname of the server #
host = 0.0.0.0
# Port of the server #
port = 12345
# Whether or not to check for game and version #
check_game_and_version = false
# The game bound to the server #
game_name = Pokemon Essentials
# The version bound to the server #
game_version = 1.0.0
# Maximum players allowed on one cluster #
max_players = 4
# Maximum number of clusters the server will create (set to 0 for unlimited) #
max_clusters = 50
# If the server should be logging to the console #
log = true
# How long a player has to not send any pings before getting kicked (in seconds) #
heartbeat_timeout = 5
# If the server uses TCP #
use_tcp = false
# If the server should use threading (Note: Sequential processing is now optimized and usually faster) #
threading = false
# The tick rate of the server (how many times per second the server updates) (set to 0 to disable) #
tick_rate = 30
# Zlib compression level for outgoing packets: speed, default, best, or none #
compression_level = speed
# Server-only key used to encrypt the GTS listings file. Set this to a long random secret string and keep it secret -- it is never sent to any client. If left blank, a random key is generated each time the server starts (listings won't survive a restart) #
gts_encryption_key =
# Maximum number of simultaneous active GTS listings a single player may have (set to 0 for unlimited) #
gts_max_listings_per_player = 5
# Maximum number of simultaneous active GTS listings across all players (set to 0 for unlimited) #
gts_max_listings_total = 200
